# aurawebs.site is served by NETLIFY. vercel.json / .vercelignore were never applied in
# production, so this file is the single source of truth for redirects and headers.
# Build settings (if any) stay in the Netlify UI; the site is static and styles.css is committed.

# --- Legacy and short URLs -> canonical pages (force: Netlify otherwise serves an existing
#     file or its pretty-URL twin instead of redirecting) ---
