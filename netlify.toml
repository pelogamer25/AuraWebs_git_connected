# --- One English home: "/" (en/index.html was a second, different EN home canonicalised to "/") ---
[[redirects]]
  from = "/en/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/en"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/en/"
  to = "/"
  status = 301
  force = true

# --- Internal working folders (SEO research, plans): never public ---
[[redirects]]
  from = "/seo/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# --- Headers ---
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/archive/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/scripts/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
