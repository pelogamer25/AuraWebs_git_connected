# aurawebs.site is served by NETLIFY (not Vercel). This file is the single source of truth for
# redirects and headers; build settings, if any, stay in the Netlify UI (styles.css is committed).
#
# URLs are clean: /x is served from x.html and /dir/ from dir/index.html (Netlify does this natively).
# Every old ".html" address 301s to its clean URL. Rules are matched on the incoming path only, so
# "/x.html -> /x" cannot loop with Netlify serving /x from x.html (verified 2026-10-24).

# --- Old .html addresses -> clean URLs ---
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

